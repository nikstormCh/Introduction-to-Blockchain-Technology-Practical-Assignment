spring.application.name=proof-of-prompt
spring.datasource.url=${PROOF_DATABASE_URL:jdbc:postgresql://127.0.0.1:5432/proof_of_prompt}
spring.datasource.username=${PROOF_DATABASE_USER:proof_of_prompt_app}
spring.datasource.password=${PROOF_DATABASE_PASSWORD:}
spring.datasource.hikari.data-source-properties.logServerErrorDetail=false
# The database owner installs the schema. The application role only reads and inserts evidence.
spring.sql.init.mode=never
